# CI/CD: push у main → тести → Docker-образ у GitHub Container Registry → деплой на VPS по SSH.
# Pull request'и лише перевіряються (тести й збірка), без публікації й деплою.
#
# Для деплою потрібні (Settings → Secrets and variables → Actions):
#   secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY (приватний ключ), необов'язково VPS_PORT, VPS_KNOWN_HOSTS
#   variables: DOMAIN (для перевірки після деплою), необов'язково DEPLOY_PATH (за замовчуванням /opt/devworld)
# Поки VPS_HOST не задано, крок деплою пропускається.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Сервер — тести (PostgreSQL через Testcontainers)
        working-directory: server
        run: ./gradlew test

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Клієнт — лінтер, типи, збірка
        working-directory: client
        run: |
          npm ci
          npx oxlint src
          npm run build

  image:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Назва образу (GHCR вимагає нижній регістр)
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.name.outputs.image }}:${{ github.sha }}
            ${{ steps.name.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/devworld' }}
      DOMAIN: ${{ vars.DOMAIN }}
      IMAGE: ${{ needs.image.outputs.image }}:${{ github.sha }}
    steps:
      - name: Чи налаштовано VPS
        id: check
        run: |
          if [ -z "$VPS_HOST" ]; then
            echo "Секрет VPS_HOST не задано — деплой пропущено (див. README → Деплой)." >> "$GITHUB_STEP_SUMMARY"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.enabled == 'true'

      - name: SSH-ключ
        if: steps.check.outputs.enabled == 'true'
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          # Краще задати VPS_KNOWN_HOSTS (ssh-keyscan -p PORT HOST); інакше — довіряємо ключу хоста з першого підключення.
          if [ -n "$KNOWN_HOSTS" ]; then printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" > ~/.ssh/known_hosts 2>/dev/null; fi

      - name: Деплой
        if: steps.check.outputs.enabled == 'true'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SSH="ssh -i ~/.ssh/id_deploy -p $VPS_PORT $VPS_USER@$VPS_HOST"
          # Конфіги з репозиторію — джерело правди; .env із секретами живе лише на сервері.
          # Caddyfile — поруч, як .new: перезавантажуємо Caddy лише якщо він справді змінився.
          scp -i ~/.ssh/id_deploy -P "$VPS_PORT" deploy/compose.yaml "$VPS_USER@$VPS_HOST:$DEPLOY_PATH/"
          scp -i ~/.ssh/id_deploy -P "$VPS_PORT" deploy/Caddyfile "$VPS_USER@$VPS_HOST:$DEPLOY_PATH/Caddyfile.new"
          # Генератор статей золотих яєць (запускає cron на сервері, див. README → Золоті яйця).
          $SSH "mkdir -p '$DEPLOY_PATH/eggs/prompts'"
          scp -i ~/.ssh/id_deploy -P "$VPS_PORT" deploy/eggs/generate.py "$VPS_USER@$VPS_HOST:$DEPLOY_PATH/eggs/"
          scp -i ~/.ssh/id_deploy -P "$VPS_PORT" deploy/eggs/prompts/*.md "$VPS_USER@$VPS_HOST:$DEPLOY_PATH/eggs/prompts/"
          echo "$GHCR_TOKEN" | $SSH "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"
          # Без простою: новий контейнер app — поруч зі старим; коли він здоровий, старий зупиняється (зберігає
          # гравців у БД), і клієнти за секунду перепідключаються до нового. Новий не піднявся — прибираємо його,
          # старий працює далі. Міграції Flyway накочує новий, поки старий ще працює, — тож вони мають бути сумісні
          # зі старим кодом (додавати, а не перейменовувати / видаляти).
          $SSH "set -e
            cd '$DEPLOY_PATH'
            test -f .env || { echo 'Немає $DEPLOY_PATH/.env — створи з deploy/.env.example'; exit 1; }
            sed -i '/^APP_IMAGE=/d' .env && echo 'APP_IMAGE=$IMAGE' >> .env
            docker compose pull app
            caddy_changed=0
            if ! cmp -s Caddyfile.new Caddyfile 2>/dev/null; then cat Caddyfile.new > Caddyfile; caddy_changed=1; fi
            rm -f Caddyfile.new
            # db і caddy — без перезапуску app (caddy перестворюється лише якщо змінився його опис у compose).
            docker compose up -d --no-deps db caddy
            [ \$caddy_changed = 1 ] && docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile
            old=\$(docker compose ps -q app)
            if [ -z \"\$old\" ]; then
              docker compose up -d --no-deps app
            else
              docker compose up -d --no-deps --no-recreate --scale app=2 app
              new=\$(docker compose ps -q app | grep -v -F \"\$old\")
              ip=\$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' \$new)
              healthy=0
              for i in \$(seq 1 60); do
                if docker compose exec -T caddy wget -qO- http://\$ip:8080/actuator/health 2>/dev/null | grep -q UP; then healthy=1; break; fi
                sleep 2
              done
              if [ \$healthy = 0 ]; then
                echo 'Новий контейнер не став здоровим — лишаємо старий'; docker logs --tail 80 \$new || true
                docker rm -f \$new; exit 1
              fi
              docker stop -t 30 \$old && docker rm \$old
              docker compose up -d --no-deps --no-recreate --scale app=1 app
            fi
            docker compose up -d --remove-orphans --no-deps --no-recreate db caddy app
            docker image prune -f
            docker logout ghcr.io"

      - name: Перевірка, що гра відповідає
        if: steps.check.outputs.enabled == 'true' && env.DOMAIN != ''
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "https://$DOMAIN/actuator/health" | grep -q '"UP"'; then echo "OK: https://$DOMAIN"; exit 0; fi
            sleep 5
          done
          echo "https://$DOMAIN не відповідає після деплою" && exit 1

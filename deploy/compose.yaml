# Продакшн на VPS: застосунок + PostgreSQL + Caddy (HTTPS від Let's Encrypt, проксі для WebSocket).
# Лежить у DEPLOY_PATH на сервері; GitHub Actions оновлює цей файл і APP_IMAGE в .env на кожен деплой.
# Деплой без простою: новий контейнер app стартує поруч зі старим (scale 2), старий зупиняється, коли новий
# здоровий (див. .github/workflows/deploy.yml). Тому в app немає ні container_name, ні опублікованих портів.
# Змінні — з .env поруч (див. .env.example).
services:
  db:
    image: postgres:18
    restart: unless-stopped
    mem_limit: 384m
    environment:
      POSTGRES_DB: devworld
      POSTGRES_USER: devworld
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задай POSTGRES_PASSWORD у .env}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devworld -d devworld"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    image: ${APP_IMAGE:?задай APP_IMAGE у .env}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # На сервері 2 ГБ RAM і ще сусіди (PostgreSQL, раннер CI) — JVM бере 75% від цього ліміту.
    mem_limit: 768m
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/devworld
      SPRING_DATASOURCE_USERNAME: devworld
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      GAME_ALLOWED_ORIGINS: https://${DOMAIN:?задай DOMAIN у .env}
      # Токен закритого API статей яєць; порожній — API вимкнений.
      GAME_ADMIN_TOKEN: ${GAME_ADMIN_TOKEN:-}
    # Назовні не публікуємо: з інтернету до застосунку ходить лише Caddy (і генератор статей — через Caddy, див. нижче).

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
      # Лише для генератора статей яєць на цьому ж сервері (deploy/eggs) — до того застосунку, що зараз працює.
      - "127.0.0.1:8090:8090"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db-data:
  caddy-data:
  caddy-config:

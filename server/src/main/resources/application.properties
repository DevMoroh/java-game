spring.application.name=server
server.port=8080
game.tick-rate=20
# Скільки днів тримати повідомлення чату (старіші видаляються щодоби).
game.chat.retention-days=30
# Як часто зберігати в БД очки й позиції гравців, що в грі (на випадок падіння сервера).
game.store.flush-interval-ms=5000
# Обробка WebSocket-повідомлень у віртуальних потоках (Tomcat створює віртуальний потік на кожне завдання
# замість пулу платформних). Власні потоки гри (game-loop, db-writer) лишаються платформними.
spring.threads.virtual.enabled=true
# Звідки можна підключатися до /ws (через кому). Для розробки — будь-звідки; у продакшні —
# GAME_ALLOWED_ORIGINS=https://твій-домен (див. deploy/compose.yaml).
game.allowed-origins=*
# За проксі (Caddy): довіряти X-Forwarded-* — правильна схема (https) і адреса клієнта.
server.forward-headers-strategy=framework
# Зовні — лише health (для перевірки після деплою); решта actuator-ендпоінтів не публікуються.
management.endpoints.web.exposure.include=health
